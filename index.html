<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>甬哥-ArgoSBX小钢炮💣一键SSH V2026——zv修改版</title>
  <style>
    /* 此处完全复写原版 CSS，确保视觉一致 */
    :root {
      --bg:#0b1020; --card:#121831; --ink:#e9edf7; --sub:#b7c1d9; --line:#263255;
      --acc:#4f7cff; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444;
      --input-bg:#0d1430; --button-bg-dark:#1a2346; --button-bg-light:#121a39;
      --body-bg: linear-gradient(180deg, var(--bg) 0%, #0e1530 100%);
    }
    .light-mode {
      --bg:#ffffff; --card:#ffffff; --ink:#1a202c; --sub:#4a5568; --line:#e2e8f0;
      --acc:#4f7cff; --input-bg:#f7fafc; --button-bg-dark:#edf2f7; --button-bg-light:#e2e8f0;
      --body-bg: #f7fafc;
    }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--body-bg); color: var(--ink); min-height: 100vh; padding: 20px; transition: 0.3s; }
    .container { width: 100%; max-width: 850px; margin: 0 auto; background: var(--card); border-radius: 12px; border: 1px solid var(--line); box-shadow: 0 10px 40px rgba(0,0,0,0.3); overflow: hidden; }
    .header { padding: 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    .tabs { display: flex; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--line); }
    .tab { padding: 12px 25px; cursor: pointer; color: var(--sub); font-size: 0.9rem; font-weight: bold; }
    .tab.active { color: var(--acc); border-bottom: 2px solid var(--acc); background: rgba(79, 124, 255, 0.05); }
    .content { padding: 25px; }
    .section-title { font-size: 0.8rem; font-weight: bold; color: var(--acc); text-transform: uppercase; margin: 20px 0 15px 0; display: flex; align-items: center; gap: 10px; }
    .section-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
    .item { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.75rem; color: var(--sub); }
    input, select { padding: 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--input-bg); color: var(--ink); font-size: 0.9rem; outline: none; }
    input:focus { border-color: var(--acc); }
    
    /* 协议勾选样式 */
    .protocol-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; background: rgba(0,0,0,0.1); padding: 15px; border-radius: 8px; border: 1px solid var(--line); }
    .check-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; cursor: pointer; color: var(--sub); }
    .check-item input { width: auto; cursor: pointer; }
    .check-item:hover { color: var(--ink); }

    .terminal { margin-top: 25px; background: #000; border-radius: 8px; border: 1px solid var(--line); padding: 15px; }
    textarea { width: 100%; background: transparent; border: none; color: #00ff00; font-family: monospace; font-size: 0.85rem; resize: none; outline: none; line-height: 1.6; }
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    .btn { flex: 1; padding: 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-primary { background: var(--acc); color: white; }
    .btn-sub { background: var(--button-bg-dark); color: var(--sub); border: 1px solid var(--line); }
    #toast { visibility: hidden; background: var(--ok); color: white; padding: 10px 20px; border-radius: 5px; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; }
    #toast.show { visibility: visible; animation: f-in 0.3s forwards; }
    @keyframes f-in { from {top: 0; opacity: 0;} to {top: 20px; opacity: 1;} }
  </style>
</head>
<body>

<div id="toast">复制成功</div>

<div class="container">
  <div class="header">
    <h1>💣 ArgoSBX <span style="font-size:0.8rem; vertical-align:middle; opacity:0.6;">V2026 PRO</span></h1>
    <button onclick="document.body.classList.toggle('light-mode')" class="btn-sub" style="padding: 5px 15px;">🌓 切换主题</button>
  </div>

  <div class="tabs">
    <div class="tab active">部署配置</div>
    <div class="tab">高级管理</div>
    <div class="tab">使用教程</div>
  </div>

  <div class="content">
    <div class="section-title">协议选项 (勾选即开启)</div>
    <div style="margin-bottom:10px; font-size:0.75rem; color:var(--warn);">Xray 协议：</div>
    <div class="protocol-grid">
      <label class="check-item"><input type="checkbox" data-var="vls_ws" value="yes"> Vless-WS</label>
      <label class="check-item"><input type="checkbox" data-var="vm_ws" value="yes"> Vmess-WS</label>
      <label class="check-item"><input type="checkbox" data-var="tro_ws" value="yes"> Trojan-WS</label>
      <label class="check-item"><input type="checkbox" data-var="vls_re" value="yes"> Vless-Reality</label>
    </div>
    <div style="margin:15px 0 10px 0; font-size:0.75rem; color:var(--acc);">Sing-box 协议：</div>
    <div class="protocol-grid">
      <label class="check-item"><input type="checkbox" data-var="hy2" value="yes"> Hysteria 2</label>
      <label class="check-item"><input type="checkbox" data-var="tuic" value="yes"> TUIC V5</label>
      <label class="check-item"><input type="checkbox" data-var="vls_grpc" value="yes"> Vless-gRPC</label>
    </div>

    <div class="section-title">核心参数设置</div>
    <div class="grid">
      <div class="item">
        <label>节点名称前缀 (np)</label>
        <input type="text" id="np" data-var="np" placeholder="例如: 甬哥US" />
      </div>
      <div class="item">
        <label>内部监听端口 (in_port)</label>
        <input type="number" id="in_port" data-var="in_port" placeholder="随机" />
      </div>
      <div class="item">
        <label>外部映射端口 (out_port)</label>
        <input type="number" id="out_port" data-var="out_port" placeholder="443" />
      </div>
      <div class="item">
        <label>优先出站策略 (ip_pref)</label>
        <select id="ip_pref" data-var="ip_pref">
          <option value="">自动路由</option>
          <option value="4">IPv4 优先</option>
          <option value="6">IPv6 优先</option>
        </select>
      </div>
    </div>

    <div class="section-title">Argo 隧道设置</div>
    <div class="grid">
      <div class="item" style="grid-column: span 2;">
        <label>Argo Token (ARGO_AUTH)</label>
        <input type="text" data-var="ARGO_AUTH" placeholder="eyJhIjoi... (留空则启用临时隧道)" />
      </div>
      <div class="item">
        <label>固定隧道域名 (ARGO_DOMAIN)</label>
        <input type="text" data-var="ARGO_DOMAIN" placeholder="vls.abc.com" />
      </div>
      <div class="item">
        <label>Argo 优选IP/域名 (argo_ip)</label>
        <input type="text" data-var="argo_ip" placeholder="cf.shun.com" />
      </div>
    </div>

    <div class="section-title">GitHub Gist 备份同步</div>
    <div class="grid">
      <div class="item">
        <label>Gist ID</label>
        <input type="text" data-var="GIST_ID" placeholder="32位字符 ID" />
      </div>
      <div class="item">
        <label>GitHub Token</label>
        <input type="text" data-var="GH_TOKEN" placeholder="ghp_xxxxxxxx" />
      </div>
      <div class="item">
        <label>直连自定义地址 (direct_ip)</label>
        <input type="text" data-var="direct_ip" placeholder="VPS 真实 IP" />
      </div>
    </div>

    <div class="terminal">
      <div style="display:flex; gap:5px; margin-bottom:10px;">
        <div style="width:10px;height:10px;border-radius:50%;background:#ff5f56"></div>
        <div style="width:10px;height:10px;border-radius:50%;background:#ffbd2e"></div>
        <div style="width:10px;height:10px;border-radius:50%;background:#27c93f"></div>
      </div>
      <textarea id="output" rows="4" readonly></textarea>
    </div>

    <div class="btn-group">
      <button class="btn btn-primary" id="copy">📋 复制一键安装指令</button>
      <button class="btn btn-sub" onclick="location.reload()">🔄 重置</button>
    </div>
  </div>
</div>

<script>
  const output = document.getElementById('output');
  
  function update() {
    let vars = "";
    // 抓取所有 input (text/number/select)
    document.querySelectorAll('input[type="text"][data-var], input[type="number"][data-var], select[data-var]').forEach(el => {
      if(el.value.trim()) vars += `${el.getAttribute('data-var')}="${el.value.trim()}" `;
    });
    // 抓取所有 checkbox (协议选项)
    document.querySelectorAll('input[type="checkbox"][data-var]:checked').forEach(el => {
      vars += `${el.getAttribute('data-var')}="yes" `;
    });

    const cmd = "bash argosbx.sh";
    output.value = vars + cmd;
  }

  document.querySelectorAll('input, select').forEach(el => {
    el.addEventListener('input', update);
    el.addEventListener('change', update);
  });

  update();

  document.getElementById('copy').addEventListener('click', async () => {
    output.select();
    try {
      await navigator.clipboard.writeText(output.value);
      const t = document.getElementById('toast');
      t.className = 'show';
      setTimeout(() => t.className = '', 2500);
    } catch(e) { document.execCommand('copy'); }
  });
</script>
</body>
</html>
