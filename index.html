<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>甬哥-ArgoSBX小钢炮💣一键SSH V2026——zv修改版</title>
  <style>
    :root {
      --bg:#0b1020;
      --card:#121831;
      --ink:#e9edf7;
      --sub:#b7c1d9;
      --line:#263255;
      --acc:#4f7cff;
      --ok:#22c55e;
      --warn:#f59e0b;
      --err:#ef4444;
      --input-bg:#0d1430;
      --button-bg-dark:#1a2346;
      --button-bg-light:#121a39;
      --body-bg: linear-gradient(180deg, var(--bg) 0%, #0e1530 100%);
    }
    .light-mode {
      --bg:#ffffff;
      --card:#ffffff;
      --ink:#1a202c;
      --sub:#4a5568;
      --line:#e2e8f0;
      --acc:#4f7cff;
      --input-bg:#f7fafc;
      --button-bg-dark:#edf2f7;
      --button-bg-light:#e2e8f0;
      --body-bg: #f7fafc;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--body-bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      transition: all 0.3s ease;
    }
    .header-bar {
      width: 100%;
      max-width: 650px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .theme-toggle {
      background: var(--button-bg-dark);
      color: var(--ink);
      border: 1px solid var(--line);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .theme-toggle:hover { background: var(--button-bg-light); }
    
    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      padding: 30px;
      border: 1px solid var(--line);
      transition: all 0.3s ease;
      box-sizing: border-box;
    }
    h1 {
      font-size: 1.4rem;
      text-align: center;
      margin-top: 0;
      margin-bottom: 24px;
      color: var(--acc);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 500px) {
      .grid { grid-template-columns: 1fr; }
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--sub);
    }
    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--input-bg);
      color: var(--ink);
      font-size: 1rem;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--acc);
      box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.2);
    }
    .output-area {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px dashed var(--line);
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--acc);
      background: rgba(79, 124, 255, 0.05);
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9rem;
      box-sizing: border-box;
      resize: vertical;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      gap: 12px;
    }
    button.action-btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button.action-btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--acc); color: #fff; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: var(--button-bg-dark); color: var(--ink); border: 1px solid var(--line); }
    .btn-secondary:hover { background: var(--button-bg-light); }
  </style>
</head>
<body>

<div class="header-bar">
  <div style="color: var(--sub); font-weight: bold;">v2026.zv_refactored</div>
  <button class="theme-toggle" id="theme-btn">🌓 切换主题</button>
</div>

<div class="container">
  <h1>💣 ArgoSBX 部署指令生成器</h1>

  <div class="form-group">
    <label>节点名称前缀</label>
    <input type="text" id="np" data-var="np" placeholder="例如: 甬哥US" />
  </div>

  <div class="grid">
    <div class="form-group">
      <label>Argo 优选IP/域名</label>
      <input type="text" id="argo_ip" data-var="argo_ip" placeholder="留空则使用默认 IP" />
    </div>
    <div class="form-group">
      <label>直连节点自定义地址</label>
      <input type="text" id="direct_ip" data-var="direct_ip" placeholder="留空则自动获取 VPS IP" />
    </div>
  </div>

  <div class="grid">
    <div class="form-group">
      <label>内部监听端口</label>
      <input type="number" id="in_port" data-var="in_port" placeholder="留空则系统随机生成" />
    </div>
    <div class="form-group">
      <label>外部映射端口</label>
      <input type="number" id="out_port" data-var="out_port" placeholder="例如: 443" />
    </div>
  </div>

  <div class="form-group">
    <label>优先 IPv4/IPv6 出站策略</label>
    <select id="ip_pref" data-var="ip_pref">
      <option value="">默认 (由系统自动路由)</option>
      <option value="4">强制优先 IPv4 (出站)</option>
      <option value="6">强制优先 IPv6 (出站)</option>
    </select>
  </div>
  
  <div class="form-group">
    <label>Argo Token (固定隧道)</label>
    <input type="text" id="argo_token" data-var="ARGO_AUTH" placeholder="eyJhIjoi... (留空则使用临时域名隧道)" />
  </div>

  <div class="output-area">
    <label>⚡ 最终执行指令 (自动实时生成)：</label>
    <textarea id="output" readonly></textarea>
    
    <div class="btn-group">
      <button class="action-btn btn-primary" id="copy">📋 一键复制指令</button>
      <button class="action-btn btn-secondary" id="reset">🔄 重置清空</button>
    </div>
  </div>
</div>

  const themeBtn = document.getElementById('theme-btn');
  themeBtn.addEventListener('click', () => {
    document.body.classList.toggle('light-mode');
  });
